name: Valider pull request
on: [pull_request]
jobs:
  valid-pull-request:
    name: Valider pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: navikt/fp-gha-workflows/.github/actions/setup-yarnrc@8209a5e47f994b1274acb0917ad2741071660f26 # main 2026-09-01

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.1.0
          cache: 'yarn'

      - name: Installere dependencies
        run: yarn install --immutable

      - name: Bygg
        run: yarn build

      - name: Stylelint
        run: yarn stylelint

      - name: ESLint
        run: yarn eslint

      - name: Typescript
        run: yarn tsc

      - name: Run test
        run: yarn test

      - name: Bygg storybook
        if: contains(github.event.pull_request.title, 'storybook')
        run: yarn build:storybook

  browser-tests:
    name: Browsertester
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: navikt/fp-gha-workflows/.github/actions/setup-yarnrc@8209a5e47f994b1274acb0917ad2741071660f26 # main 2026-09-01

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.1.0
          cache: 'yarn'

      - name: Installere dependencies
        run: yarn install --immutable

      - name: Bygg
        run: yarn build

      - name: Installer Chromium
        run: yarn exec playwright install --with-deps chromium

      - name: Kjør browsertester
        run: yarn test:browser

      - name: Kjør Storybook-tester
        run: yarn test:storybook

  sif-code-scan:
    runs-on: ubuntu-latest
    name: 'SIF Code Scan'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: navikt/sif-gha-workflows/.github/actions/sif-code-scan@97a944ba12c0db588a29cfeed8a7dcb22e087d3f # v1

  knip-it:
    name: Kjør knip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Run knip
        uses: navikt/fp-gha-workflows/.github/actions/knip-it@8209a5e47f994b1274acb0917ad2741071660f26 # main 2026-09-01
        with:
          package-manager: 'yarn'
          node-version: 26.1.0

name: Publish packages from tags

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: navikt/fp-gha-workflows/.github/actions/setup-yarnrc@8209a5e47f994b1274acb0917ad2741071660f26 # main 2026-09-01

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.1.0
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@navikt'

      - name: Installere dependencies
        run: yarn install --immutable

      - name: Restore .yarnrc.yml
        run: git restore .yarnrc.yml

      - name: Build packages
        run: yarn build

      - name: Publish packages from existing tags
        run: lerna publish from-git --yes --no-private
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
